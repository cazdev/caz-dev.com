<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <title>Hospora</title>
  <desc>Hospitality, connected. Bookings, orders, vouchers, purchasing, staff, analytics and mail.</desc>
  <rect width="1600" height="640" fill="#0b7a59" />
  <!-- Keep the existing brand mark and every line of copy inside the card's crop-safe area. -->
  <g id="hospora-content" fill="#fff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(622 208)">
      <g fill="none" stroke="#fff" stroke-width="12">
        <circle cx="30" cy="30" r="26" />
        <circle cx="68" cy="30" r="26" />
      </g>
      <text x="122" y="63" font-size="60" font-weight="700" text-anchor="start">hospora</text>
    </g>
    <text x="800" y="358" font-size="78" font-weight="700">Hospitality, connected.</text>
    <g fill="#e0efea" font-size="34">
      <text x="800" y="410">Bookings, orders, vouchers, purchasing,</text>
      <text x="800" y="450">staff, analytics and mail.</text>
    </g>
  </g>
</svg>
